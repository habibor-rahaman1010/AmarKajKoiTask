<div class="container-page">
  <h1>Team Performance</h1>
  <p-card>
    <p-table [value]="rows()" [loading]="loading()" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 20, 50]"
      styleClass="p-datatable-sm">
      <ng-template pTemplate="header">
        <tr>
          <th>Employee</th>
          <th>Total</th>
          <th>Open</th>
          <th>Passed</th>
          <th>Failed</th>
          <th>Overdue</th>
          <th>Pass Rate</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-r>
        <tr>
          <td>{{ r.fullName }}</td>
          <td>{{ r.total }}</td>
          <td>{{ r.open }}</td>
          <td>
            <span style="color: #059669; font-weight: 600">{{ r.passed }}</span>
          </td>
          <td>
            <span style="color: #dc2626; font-weight: 600">{{ r.failed }}</span>
          </td>
          <td>{{ r.overdue }}</td>
          <td>
            <div class="row">
              <p-progressBar [value]="r.passRate" [style]="{ width: '80px', height: '8px' }"
                [showValue]="false"></p-progressBar>
              <span>{{ r.passRate }}%</span>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7"><span class="muted">No employees yet.</span></td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
